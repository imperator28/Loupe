name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      label:
        description: Name for the packaged zips (a testing build, e.g. v0.1.4-beta.1). Defaults to the branch name.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag names the assets and the release title, but the version the app
  # reports in its About dialog comes from project(VERSION) in CMakeLists.txt.
  # Nothing tied the two together, so tagging without bumping the project would
  # publish "loupe-v0.1.3-*" archives whose About dialog still read 0.1.2. This
  # runs first and cheaply, so a mismatch fails in seconds rather than after a
  # full two-platform build.
  verify-version:
    name: Tag matches project version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag against project(VERSION)
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^project(Loupe VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          tag_version="${GITHUB_REF_NAME#v}"
          # A pre-release tag (v0.1.4-beta.1, v0.1.4-rc.2) ships the version it is a
          # pre-release of: CMake versions cannot carry the suffix, so only the
          # numeric part is compared. Any other suffix is refused.
          if [[ "${tag_version}" == *-* ]]; then
            if ! [[ "${tag_version}" =~ ^[0-9.]+-(beta|rc)\.[0-9]+$ ]]; then
              echo "::error::Pre-release tags must look like v1.2.3-beta.N or v1.2.3-rc.N"
              exit 1
            fi
            tag_version="${tag_version%%-*}"
          fi
          echo "project(VERSION) = ${project_version}"
          echo "tag              = ${GITHUB_REF_NAME} (${tag_version})"
          if [ -z "${project_version}" ]; then
            echo "::error::Could not parse project(Loupe VERSION ...) from CMakeLists.txt"
            exit 1
          fi
          if [ "${project_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} would ship an About dialog reading ${project_version}."
            echo "::error::Bump project(Loupe VERSION) in CMakeLists.txt and vcpkg.json, or retag."
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: verify-version
    # verify-version only runs for tags, and a job that needs a skipped job is
    # skipped too -- which would leave workflow_dispatch unable to build at all.
    # Proceed when the gate passed or when it did not apply.
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon release
            os: macos-14
            configure_preset: macos-arm64-release
            vcpkg_triplet: arm64-osx-release
            vcpkg_cache_path: ~/.cache/vcpkg/archives
            vcpkg_install_options: --clean-buildtrees-after-build;--clean-packages-after-build
          - name: Windows 11 x64 release
            os: windows-2025
            configure_preset: windows-release
            vcpkg_triplet: x64-windows-release
            vcpkg_cache_path: ~\AppData\Local\vcpkg\archives
            # Short buildtrees root keeps Qt object paths under Windows'
            # MAX_PATH; see native-verify.yml for the measured rationale.
            vcpkg_install_options: --clean-buildtrees-after-build;--clean-packages-after-build;--x-buildtrees-root=D:/bt
    env:
      # The zips are named after the tag. A dispatch on a branch takes the given label or the
      # branch name, and a branch name may contain '/', which the packaging steps turn into
      # '-' rather than writing the zip into a directory that does not exist.
      PACKAGE_LABEL: ${{ inputs.label || github.ref_name }}
      LOUPE_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_COMMIT: db4723bd0a99eab031f1a3dee4336dca43049c87
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Enable the MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install macOS vcpkg prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: brew install autoconf autoconf-archive automake libtool

      - name: Install vcpkg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$LOUPE_VCPKG_ROOT"
          git -C "$LOUPE_VCPKG_ROOT" checkout --detach "$VCPKG_COMMIT"
          "$LOUPE_VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:LOUPE_VCPKG_ROOT"
          git -C "$env:LOUPE_VCPKG_ROOT" checkout --detach "$env:VCPKG_COMMIT"
          & "$env:LOUPE_VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Set vcpkg root (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "VCPKG_ROOT=$LOUPE_VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Set vcpkg root (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:LOUPE_VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.vcpkg_cache_path }}
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-

      - name: Configure
        timeout-minutes: 330
        shell: bash
        run: |
          # Host triplet must match the target so Qt host tools do not build
          # a second dependency world; clean options bound peak runner disk.
          # See native-verify.yml for the full rationale.
          cmake --preset "${{ matrix.configure_preset }}" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" \
            -DVCPKG_HOST_TRIPLET="${{ matrix.vcpkg_triplet }}" \
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/triplets" \
            -DVCPKG_INSTALL_OPTIONS="${{ matrix.vcpkg_install_options }}"

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.vcpkg_cache_path }}
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build
        shell: bash
        run: cmake --build --preset "${{ matrix.configure_preset }}" --parallel

      - name: Test
        shell: bash
        run: |
          ctest --preset "${{ matrix.configure_preset }}" --output-on-failure --timeout 600 || {
            # Keep the failing run's QML log; the re-run below would overwrite it.
            cp "build/${{ matrix.configure_preset }}/tests/qml-smoke.log" qml-smoke-first-run.log 2>/dev/null || true
            ctest --preset "${{ matrix.configure_preset }}" --rerun-failed --extra-verbose --timeout 600
            exit 1
          }

      - name: Show QML smoke log
        if: failure()
        shell: bash
        run: cat qml-smoke-first-run.log || echo "qml-smoke did not fail, or wrote no log"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          STAGE=dist/loupe-macos-arm64
          mkdir -p "$STAGE"
          cp -R "build/${{ matrix.configure_preset }}/src/app/Loupe.app" "$STAGE/"
          cp "scripts/macos/Open Loupe (first run).command" "$STAGE/"
          test -f "$STAGE/Loupe.app/Contents/MacOS/loupe-worker"
          ditto -c -k --keepParent "$STAGE" "loupe-${PACKAGE_LABEL//\//-}-macos-arm64.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          scripts/package/stage-windows.sh "${{ matrix.configure_preset }}" "${{ matrix.vcpkg_triplet }}" dist/loupe-windows-x64
          cd dist && 7z a "../loupe-${PACKAGE_LABEL//\//-}-windows-x64.zip" loupe-windows-x64

      - name: Launch the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Started from the staged folder with only system directories on PATH and no Qt
        # environment, exactly as on a tester's machine: CI tests otherwise point Qt at vcpkg's
        # own plugins, which is how a package that could not start was never caught.
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QT_QPA_PLATFORM, Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $app = Start-Process -FilePath "dist/loupe-windows-x64/Loupe.exe" -ArgumentList "--self-check" -PassThru -NoNewWindow -RedirectStandardError self-check.log
          $null = $app.Handle
          if (-not $app.WaitForExit(120000)) {
            Stop-Process -Id $app.Id -Force
            Get-Content self-check.log -ErrorAction SilentlyContinue
            throw "Loupe.exe did not finish its self-check within two minutes"
          }
          $app.WaitForExit()
          Get-Content self-check.log -ErrorAction SilentlyContinue
          if ($app.ExitCode -ne 0) { throw "Packaged Loupe.exe failed its self-check (exit code $($app.ExitCode))" }

      - name: Launch the packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # The bundle as a tester runs it, with no Qt environment pointing at the build tree.
        run: |
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u QT_QPA_PLATFORM QT_FORCE_STDERR_LOGGING=1 \
            perl -e 'alarm 120; exec @ARGV' "dist/loupe-macos-arm64/Loupe.app/Contents/MacOS/Loupe" --self-check

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.vcpkg_triplet }}
          path: loupe-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    # Only tags publish a release; manual dispatch runs stop at artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Prefer the hand-written section for this tag in CHANGELOG.md: an
          # auto-generated commit list does not tell a reader what changed, and
          # for a release carrying a known limitation it cannot state it at all.
          # Fall back to generated notes when the tag has no section yet.
          # A suffixed tag is a pre-release: published for testing, never marked
          # as the latest release the README's download link resolves to.
          prerelease=()
          case "${{ github.ref_name }}" in *-*) prerelease=(--prerelease) ;; esac
          notes_file=""
          if [ -f CHANGELOG.md ]; then
            awk -v tag="## ${{ github.ref_name }}" '
              $0 == tag { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then notes_file="release-notes.md"; fi
          fi
          # Idempotent: a moved tag (README/changelog landing after the first
          # publish, or any retag) re-runs this workflow against a release that
          # already exists. `gh release create` would fail outright in that
          # case, so update in place instead -- same notes logic, existing
          # assets replaced via --clobber.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; updating in place"
            if [ -n "$notes_file" ]; then
              gh release edit "${{ github.ref_name }}" "${prerelease[@]}" \
                --title "Loupe ${{ github.ref_name }}" \
                --notes-file "$notes_file"
            fi
            gh release upload "${{ github.ref_name }}" loupe-*.zip --clobber
          elif [ -n "$notes_file" ]; then
            echo "Using CHANGELOG.md section for ${{ github.ref_name }}"
            gh release create "${{ github.ref_name }}" "${prerelease[@]}" \
              --title "Loupe ${{ github.ref_name }}" \
              --notes-file "$notes_file" \
              loupe-*.zip
          else
            echo "No CHANGELOG.md section for ${{ github.ref_name }}; generating notes"
            gh release create "${{ github.ref_name }}" "${prerelease[@]}" \
              --title "Loupe ${{ github.ref_name }}" \
              --generate-notes \
              loupe-*.zip
          fi
